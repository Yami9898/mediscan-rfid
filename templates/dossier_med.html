<!DOCTYPE html>
<html>
    <head>
        <title>Dossier médical</title>
        <meta charset="UTF-8">   
        <link rel="stylesheet" href="{{ url_for('static', filename='dossier_med.css') }}">  
    </head>
    <body>
        <nav class="navb">
          
            <div class="navbar">
                <ul class ="nav-menu">
                    <li><a href="{{ url_for('patient') }}" >Patient</a></li>
                    <li><a href="{{ url_for('rdv') }}">Rendez-vous</a></li>
                    <li><a href="{{ url_for('dossier_med') }}" id = 'dossier'>Dossier médical</a></li>
                    <li><a href="{{ url_for('examens') }}">Examens</a></li>
                    

                </ul>
            </div>
            <div class="logout">
                <a href ="login.html" >Déconnexion</a>
            <div>
         
        </nav>

        <menu class="menu">
            <ul class="menu-list">
                <li><a href="{{ url_for('dossier_med') }}" id = "consultations">Consultations</a></li>
                <li><a href="{{ url_for('suivi_medical') }}" id = "suivi_medical">Suivi Médical</a></li>
                <li><a href="{{ url_for('vaccins') }}" id = "vaccins">Vaccins</a></li>
            </ul>
        </menu>
        <!-- Formulaire recherche : on empêche l'envoi et on utilise JS -->
        <form method="post" action="#" onsubmit="return false;">
            <div recherche_bar class ='recherche_bar'>
                <div class ='recherche'>
                    <input type="Text" name="Recherche" id="searchInput" placeholder ='🔍  Rechercher une consultation ' class = 'recherche_PV' >
                </div>
                <div class ='add_button'>
                    <button type="submit" class ='r_button' id = "btn-add"> ✚ </button>
                </div>
                <div class ='edit_button'>
                    <button type="submit" class ='r_button' id="btn-edit"> ✍️ </button>
                </div>
                <div class ='delete_button'>
                    <button type="submit" class ='r_button' id="btn-delete"> − </button>
                </div>
                <div class ='ordo_button'>
                    <button type="submit" class ='r_button' id="btn-ordo"> 📝 </button>
                </div>
            </div>
        </form>
        
        <table id="consultation-table">
            <thead>
                <tr>
                    
                    <th>Date</th>
                    <th>Établissement</th>
                    <th>Médecin</th>
                    <th>Spécialité</th>
                    <th>Maladie</th>
                    <th>Traitement</th>
                    <th>Statut</th>
                    <th>PV</th>  
                </tr>
            </thead>
            <tbody>
                <!-- Contenu injecté par JS -->
            </tbody>
        </table>
<script>
/* ---------- variables ---------- */
const tbody = document.querySelector("#consultation-table tbody");
const btnAdd = document.getElementById('btn-add');
const btnEdit = document.getElementById('btn-edit');
const btnDelete = document.getElementById('btn-delete');
const searchInput = document.getElementById('searchInput');

let editingRow = null;
let isAdding = false;
let tousLesConsultation = [];

/* ---------- utilitaires ---------- */
function escapeHtml(text) {
  if(!text) return "";
  return String(text).replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
}

function renderRows(data) {
  // data : tableau d'objets {num_rdv, date, heure, lieu, type, type_imagerie, statut}
  tbody.innerHTML = data.map(r => `
    <tr data-num-consultation="${r.num_consultation}">
      <td>${r.date || ''}</td>
      <td>${escapeHtml(r.etablissement || '')}</td>
      <td>${escapeHtml(r.medecin || '')}</td>
      <td>${escapeHtml(r.specialite || '')}</td>
      <td>${escapeHtml(r.maladie || '')}</td>
      <td class="traitement-cell" data-traitement="${escapeHtml(r.traitement || '')}">
        ${r.traitement ? 
          `<button class="btn-view-traitements" data-content="${escapeHtml(r.traitement)}">
            Voir traitements
           </button>` : 
          'Aucun'}
      </td>
      <td>${escapeHtml(r.statut || '')}</td>
      <td>${escapeHtml(r.pv || '')}</td>
    </tr>
  `).join("");

  // Gestion de l'affichage des traitements
  document.querySelectorAll('.btn-view-traitements').forEach(btn => {
    btn.addEventListener('click', () => {
      const content = btn.dataset.content.replace(/<br>/g, '\n');
      alert(content); // Ou mieux: utiliser un modal
    });
  });

  editingRow = null;
  isAdding = false;
  resetButtons();
}

/* ---------- chargement initial ---------- */
async function loadConsultation() {
  try {
    const res = await fetch("/api/consultation" , {
            method: "GET",  // ⚠️ Bien spécifier GET);
    });
    if(!res.ok) throw new Error("Erreur réseau lors du chargement des consultations.");
    const data = await res.json();
    if (data.error) {
      tbody.innerHTML = `<tr><td colspan="7">Erreur : ${data.error}</td></tr>`;
      return;
    }
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7">Aucune consultation trouvé.</td></tr>`;
      return;
    }
    tousLesConsultation = data;
    renderRows(tousLesConsultation);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7">Erreur : ${err.message}</td></tr>`;
  }
}

/* ---------- sélection ligne ---------- */
tbody.addEventListener('click', e => {
  if (editingRow) return; // interdit selection pendant édition
  const tr = e.target.closest('tr');
  if(!tr) return;
  tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
});

/* ---------- gestion boutons ---------- */
function setEditingMode(on) {
  if(on){
    btnAdd.textContent = '✓';
    btnEdit.textContent = '❌';
    btnDelete.disabled = true;
  } else {
    btnAdd.textContent = '✚';
    btnEdit.textContent = '✍️';
    btnDelete.disabled = false;
  }
}
function resetButtons(){ setEditingMode(false); }

/* ---------- ADD (inline) ---------- */
btnAdd.addEventListener('click', () => {
  if (!editingRow) {
    isAdding = true;
    tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
    const tr = document.createElement('tr');
    tr.classList.add('editing');
    tr.dataset.numConsultation = ""; // pas d'ID encore

    tr.innerHTML = `
      <td><input type="date" required></td>
      <td><input type="text" required></td>
      <td><input type="text" required></td>
      <td><input type="text" required></td>
      <td><input type="text"></td>
      <td>
        <textarea class="form-control"></textarea>
      </td>
      <td>
        <select required>
          <option value="en cours">en cours</option>
          <option value="terminé"}>terminé</option>
        </select>
      </td>
      <td><input type="text"></td>
    `;
    tbody.prepend(tr);
    editingRow = tr;
    setEditingMode(true);
  } else {
    // ✓ : enregistrer
    saveEditingRow();
  }
});

/* ---------- EDIT (inline) ---------- */
btnEdit.addEventListener('click', () => {
  if (!editingRow) {
    const selected = tbody.querySelector('tr.selected');
    if (!selected) { alert("Sélectionnez une ligne à modifier."); return; }
    editingRow = selected;
    editingRow.classList.add('editing');
    isAdding = false;

    // Extraire valeurs (col0 = id)
    const traitement = editingRow.querySelector('.traitement-cell').dataset.traitement;
   const cells = editingRow.children; // Récupère toutes les cellules de la ligne
    // Extraire les valeurs des cellules
    const values = {
      date: cells[0].textContent.trim(),
      etablissement: cells[1].textContent.trim(),
      medecin: cells[2].textContent.trim(),
      specialite: cells[3].textContent.trim(),
      maladie: cells[4].textContent.trim(),
      statut: cells[6].textContent.trim(),
      pv: cells[7].textContent.trim()
    };
    

    // s'assurer que dataset.numConsultation contient l'id (préserver)
    editingRow.dataset.numConsultation = values.id || editingRow.dataset.numConsultation || "";

    // convertir date dd/mm/yyyy -> yyyy-mm-dd si nécessaire
    let dateVal = values.date;
    if (dateVal && dateVal.includes('/')) {
      const parts = dateVal.split('/');
      if(parts.length === 3) dateVal = `${parts[2].padStart(4,'0')}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
      else dateVal = "";
    }

    editingRow.innerHTML = `
      <td><input type="date" value="${dateVal}" required></td>
      <td><input type="text" value="${escapeHtml(values.etablissement)}" required></td>
      <td><input type="text" value="${escapeHtml(values.medecin)}" required></td>
      <td><input type="text" value="${escapeHtml(values.specialite)}" required></td>
      <td><input type="text" value="${escapeHtml(values.maladie)}"></td>
      <td><textarea class="form-control">${escapeHtml(traitement).replace(/<br>/g, '\n')}</textarea></td>
      <td>
        <select required>
          <option value="en cours" ${values.statut === "en cours" ? "selected" : ""}>en cours</option>
          <option value="terminé" ${values.statut === "terminé" ? "selected" : ""}>terminé</option>
        </select>
      </td>
      <td><input type="text" value="${escapeHtml(values.pv)}"></td>
    `;

    editingRow.dataset.numConsultation = values.id || editingRow.dataset.numConsultation || "";
    setEditingMode(true);

  } else {
    // ❌ annuler édition
    editingRow = null;
    isAdding = false;
    setEditingMode(false);
    loadConsultation();
  }
});

/* ---------- DELETE ---------- */
btnDelete.addEventListener('click', async () => {
  if(editingRow){ alert("Finissez l'édition avant de supprimer."); return; }
  const selected = tbody.querySelector('tr.selected');
  if(!selected) { alert("Sélectionnez une ligne à supprimer."); return; }
  if(!confirm("Voulez-vous vraiment supprimer cette consultation ?")) return;

  const num_consultation = selected.dataset.numConsultation;
  if(!num_consultation) { alert("Impossible de supprimer une consultation non enregistré."); return; }

  try {
    const res = await fetch(`/api/consultation/${num_consultation}`, { method: 'DELETE' });
    const data = await res.json();
    if(data.error) alert(data.error);
    else {
      alert(data.message);
      loadConsultation();
    }
  } catch (err) { alert("Erreur : " + err); }
});

/* ---------- SAVE (POST ou PUT) ---------- */
async function saveEditingRow(){
  if(!editingRow) return;
  const inputs = editingRow.querySelectorAll('input, select');
  const traitements = editingRow.querySelector('textarea').value;
  for(let i=0;i<inputs.length;i++){
    if(!inputs[i].checkValidity()){
      alert("Veuillez remplir correctement tous les champs obligatoires.");
      inputs[i].focus();
      return;
    }
  }

  const body = {
    date: inputs[0].value,
    etablissement: inputs[1].value,
    medecin: inputs[2].value.trim(),
    specialite: inputs[3].value,
    maladie: inputs[4].value,
    traitement: traitements,
    statut: inputs[5].value,
    pv: inputs[6].value.trim()
  };

  const num_consultation = editingRow.dataset.numConsultation || "";
  const method = num_consultation ? 'PUT' : 'POST';
  const url = num_consultation ? `/api/consultation/${num_consultation}` : '/api/consultation';

  try {
    const res = await fetch(url, { // Utiliser l'URL dynamique
      method: method,  // Utiliser la méthode déterminée
      headers: {
        "Content-Type": "application/json",  // Important pour Flask
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(data.error) alert(data.error);
    else {
      alert(data.message);
      editingRow = null;
      isAdding = false;
      setEditingMode(false);
      loadConsultation();
    }
  } catch (err) { alert("Erreur : " + err); }
}

/* ---------- RECHERCHE CÔTÉ CLIENT ---------- */
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase();
  const filtres = tousLesConsultation.filter(r => 
    Object.values(r).some(val => String(val).toLowerCase().includes(q))
  );
  renderRows(filtres);
});

/* ---------- initial load ---------- */
document.addEventListener("DOMContentLoaded", loadConsultation);


document.getElementById('btn-ordo').addEventListener('click', async () => {
    const selectedRow = document.querySelector('#consultation-table tr.selected');
    
    if (!selectedRow) {
        alert("Veuillez sélectionner une consultation");
        return;
    }
    const consultId = selectedRow.dataset.numConsultation;
    
    // Appel direct à l'API Flask
    window.open(`/api/generer-ordonnance/${consultId}`, '_blank');
});



</script>

    </body>
</html>
