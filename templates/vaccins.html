<!DOCTYPE html>
<html>
    <head>
        <title>Vaccins</title>
        <meta charset="UTF-8">   
        <link rel="stylesheet" href="{{ url_for('static', filename='vaccins.css') }}">  
    </head>
    <body>
        <nav class="navb">
           
              <div class="navbar">
                  <ul class ="nav-menu">
                      <li><a href="{{ url_for('patient') }}" >Patient</a></li>
                      <li><a href="{{ url_for('rdv') }}">Rendez-vous</a></li>
                      <li><a href="{{ url_for('dossier_med') }}" id = 'dossier'>Dossier médical</a></li>
                      <li><a href="{{ url_for('examens') }}">Examens</a></li>

                  </ul>
              </div>
              <div class="logout">
                  <a href ="login.html" >Déconnexion</a>
              </div>
         
        </nav>

        <menu class="menu">
            <ul class="menu-list">
                <li><a href="{{ url_for('dossier_med') }}" id = "consultations">Consultations</a></li>
                <li><a href="{{ url_for('suivi_medical') }}" id = "suivi_medical">Suivi Médical</a></li>
                <li><a href="{{ url_for('vaccins') }}" id = "vaccins">Vaccins</a></li>
            </ul>
        </menu>

        <!-- Formulaire recherche : on empêche l'envoi et on utilise JS -->
        
        <form method="post" action="#" onsubmit="return false;">
            
              
              <div recherche_bar class ='recherche_bar'>
                  <div class ='recherche'>
                      <input type="Text" name="Recherche" id="searchInput" placeholder ='🔍  Rechercher un vaccin ' class = 'recherche_PV' >
                  </div>
                  <div class ='add_button'>
                      <button type="submit" class ='r_button' id = "btn-add"> ✚ </button>
                  </div>
                  <div class ='edit_button'>
                      <button type="submit" class ='r_button' id="btn-edit"> ✍️ </button>
                  </div>
                  <div class ='delete_button'>
                      <button type="submit" class ='r_button' id="btn-delete"> − </button>
                  </div>
              </div>
            
        </form>
        

        <table id="vaccins-table">
            <thead>
                <tr>
                    <th>Nom du vaccin</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Dose</th>
                    <th>Voie</th>  
                    <th>Lieu</th>  
                    <th>Responsable</th>
                </tr>
            </thead>
            <tbody>
                <!-- Contenu injecté par JS -->
            </tbody>
        </table>   
        
        <script>
/* ---------- variables ---------- */
const tbody = document.querySelector("#vaccins-table tbody");
const btnAdd = document.getElementById('btn-add');
const btnEdit = document.getElementById('btn-edit');
const btnDelete = document.getElementById('btn-delete');
const searchInput = document.getElementById('searchInput');

let editingRow = null;
let isAdding = false;
let tousLesVaccins = [];

/* ---------- utilitaires ---------- */
function escapeHtml(text) {
  if(!text) return "";
  return String(text).replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
}

function renderRows(data) {
  // data : tableau d'objets {num_vaccin, nom, type, date,dose, voie, lieu, responsable}
  tbody.innerHTML = data.map(r => `
    <tr data-num-vaccin="${r.num_vaccin}">
      <td>${escapeHtml(r.nom || '')}</td>
      <td>${escapeHtml(r.type || '')}</td>
      <td>${r.date || ''}</td>
      <td>${escapeHtml(r.dose || '')}</td>
      <td>${escapeHtml(r.voie || '')}</td>
      <td>${escapeHtml(r.lieu || '')}</td>
      <td>${escapeHtml(r.responsable || '')}</td>
    </tr>
  `).join("");
  editingRow = null;
  isAdding = false;
  resetButtons();
}

/* ---------- chargement initial ---------- */
async function loadVaccins() {
  try {
    const res = await fetch("/api/vaccins");
    if(!res.ok) throw new Error("Erreur réseau lors du chargement des vaccins.");
    const data = await res.json();
    if (data.error) {
      tbody.innerHTML = `<tr><td colspan="7">Erreur : ${data.error}</td></tr>`;
      return;
    }
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7">Aucun vaccin trouvé.</td></tr>`;
      return;
    }
    tousLesVaccins = data;
    renderRows(tousLesVaccins);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7">Erreur : ${err.message}</td></tr>`;
  }
}

/* ---------- sélection ligne ---------- */
tbody.addEventListener('click', e => {
  if (editingRow) return; // interdit selection pendant édition
  const tr = e.target.closest('tr');
  if(!tr) return;
  tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
});

/* ---------- gestion boutons ---------- */
function setEditingMode(on) {
  if(on){
    btnAdd.textContent = '✓';
    btnEdit.textContent = '❌';
    btnDelete.disabled = true;
  } else {
    btnAdd.textContent = '✚';
    btnEdit.textContent = '✍️';
    btnDelete.disabled = false;
  }
}
function resetButtons(){ setEditingMode(false); }

/* ---------- ADD (inline) ---------- */
btnAdd.addEventListener('click', () => {
  if (!editingRow) {
    isAdding = true;
    tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
    const tr = document.createElement('tr');
    tr.classList.add('editing');
    tr.dataset.numVaccin = ""; // pas d'ID encore

    tr.innerHTML = `
      <td><input type="text" required></td>
      <td>
        <select required>
          <option value="Viral"}>Virale</option>
          <option value="Bactérien">Bactérien</option>
          <option value="Combiné" >Combiné</option>
        </select>
      </td>
      <td><input type="date" required></td>
       <td>
        <select required>
          <option value="1ère"}>1ère</option>
          <option value="2ème">2ème</option>
          <option value="Rappel" >Rappel</option>
        </select>
      </td>
       <td>
        <select required>
          <option value="IM"}>IM</option>
          <option value="SC">SC</option>
          <option value="ID" >ID</option>
          <option value="Orale">Orale</option>
          <option value="Nasale" >Nasale</option>
        </select>
      </td>
      <td><input type="text" required></td>
      <td><input type="text" required></td>
    `;
    tbody.prepend(tr);
    editingRow = tr;
    setEditingMode(true);
  } else {
    // ✓ : enregistrer
    saveEditingRow();
  }
});

/* ---------- EDIT (inline) ---------- */
btnEdit.addEventListener('click', () => {
  if (!editingRow) {
    const selected = tbody.querySelector('tr.selected');
    if (!selected) { alert("Sélectionnez une ligne à modifier."); return; }
    editingRow = selected;
    editingRow.classList.add('editing');
    isAdding = false;

    // Extraire valeurs (col0 = id)
    const cells = editingRow.children;
    const values = {
      nom: cells[0].textContent.trim(),
      type: cells[1].textContent.trim(),
      date: cells[2].textContent.trim(),
      dose: cells[3].textContent.trim(),
      voie: cells[4].textContent.trim(),
      lieu: cells[5].textContent.trim(),
      responsable: cells[6].textContent.trim()
    };

    // s'assurer que dataset.numVaccin contient l'id (préserver)
    editingRow.dataset.numVaccin = values.id || editingRow.dataset.numVaccin || "";

    // convertir date dd/mm/yyyy -> yyyy-mm-dd si nécessaire
    let dateVal = values.date;
    if (dateVal && dateVal.includes('/')) {
      const parts = dateVal.split('/');
      if(parts.length === 3) dateVal = `${parts[2].padStart(4,'0')}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
      else dateVal = "";
    }

    editingRow.innerHTML = `
      <td><input type="text" value="${escapeHtml(values.nom)}" required></td>
      <td>
        <select required>
          <option value="Viral" ${values.type === "Viral" ? "selected" : ""}>Viral</option>
          <option value="Bactérien" ${values.type === "Bactérien" ? "selected" : ""}>Bactérien</option>
          <option value="Combiné" ${values.type === "Combiné" ? "selected" : ""}>Combiné</option>
        </select>
      </td>
      <td><input type="date" value="${dateVal}" required></td>
      <td>
        <select required>
          <option value="1ère" ${values.type === "1ère" ? "selected" : ""}>1ère</option>
          <option value="2ème" ${values.type === "2ème" ? "selected" : ""}>2ème</option>
          <option value="Rappel" ${values.type === "Rappel" ? "selected" : ""}>Rappel</option>
        </select>
      </td>
      <td>
        <select required>
          <option value="IM" ${values.type === "IM" ? "selected" : ""}>IM</option>
          <option value="SC" ${values.type === "SC" ? "selected" : ""}>SC</option>
          <option value="ID" ${values.type === "ID" ? "selected" : ""}>ID</option>
          <option value="Orale" ${values.type === "Orale" ? "selected" : ""}>Orale</option>
          <option value="Nasale" ${values.type === "Nasale" ? "selected" : ""}>Nasale</option>
        </select>
      </td>
      <td><input type="text" value="${escapeHtml(values.lieu)}" required></td>
      <td><input type="text" value="${escapeHtml(values.responsable)}" required></td>

      
    `;

    editingRow.dataset.numVaccin = values.id || editingRow.dataset.numVaccin || "";
    setEditingMode(true);

  } else {
    // ❌ annuler édition
    editingRow = null;
    isAdding = false;
    setEditingMode(false);
    loadVaccins();
  }
});

/* ---------- DELETE ---------- */
btnDelete.addEventListener('click', async () => {
  if(editingRow){ alert("Finissez l'édition avant de supprimer."); return; }
  const selected = tbody.querySelector('tr.selected');
  if(!selected) { alert("Sélectionnez une ligne à supprimer."); return; }
  if(!confirm("Voulez-vous vraiment supprimer ce vaccin ?")) return;

  const num_vaccin = selected.dataset.numVaccin;
  if(!num_vaccin) { alert("Impossible de supprimer un vaccin non enregistré."); return; }

  try {
    const res = await fetch(`/api/vaccins/${num_vaccin}`, { method: 'DELETE' });
    const data = await res.json();
    if(data.error) alert(data.error);
    else {
      alert(data.message);
      loadVaccins();
    }
  } catch (err) { alert("Erreur : " + err); }
});

/* ---------- SAVE (POST ou PUT) ---------- */
async function saveEditingRow(){
  if(!editingRow) return;
  const inputs = editingRow.querySelectorAll('input, select');
  for(let i=0;i<inputs.length;i++){
    if(!inputs[i].checkValidity()){
      alert("Veuillez remplir correctement tous les champs obligatoires.");
      inputs[i].focus();
      return;
    }
  }

  const body = {
    nom: inputs[0].value,
    type: inputs[1].value,
    date: inputs[2].value.trim(),
    dose: inputs[3].value,
    voie: inputs[4].value.trim(),
    lieu: inputs[5].value.trim(),
    responsable: inputs[6].value.trim()
  };

  const num_vaccin = editingRow.dataset.numVaccin || "";
  const method = num_vaccin ? 'PUT' : 'POST';
  const url = num_vaccin ? `/api/vaccins/${num_vaccin}` : '/api/vaccins';

  try {
    const res = await fetch(url, {
      method,
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(data.error) alert(data.error);
    else {
      alert(data.message);
      editingRow = null;
      isAdding = false;
      setEditingMode(false);
      loadVaccins();
    }
  } catch (err) { alert("Erreur : " + err); }
}

/* ---------- RECHERCHE CÔTÉ CLIENT ---------- */
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase();
  const filtres = tousLesVaccins.filter(r => 
    Object.values(r).some(val => String(val).toLowerCase().includes(q))
  );
  renderRows(filtres);
});

/* ---------- initial load ---------- */
document.addEventListener("DOMContentLoaded", loadVaccins);

</script>

        </body>
</html>
